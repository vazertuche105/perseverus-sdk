[package]
name = "perseverus-sdk"
description = "Wallet SDK for private, token-gated Bitcoin privacy analysis (BTC Medusa)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "perseverus_sdk"
# cdylib → Android .so / desktop .dylib/.so/.dll; staticlib → iOS XCFramework.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
# `cargo run -p perseverus-sdk --bin uniffi-bindgen -- generate --library <lib> --language kotlin --out-dir <dir>`
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]
# https endpoints (pure-Rust TLS, no OpenSSL). Not needed for the .onion service.
rustls = ["reqwest/rustls-tls", "perseverus-client-native/rustls"]

[dependencies]
perseverus-core = { path = "../core" }
perseverus-client-native = { path = "../client-native" }
uniffi = "0.28"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "socks"] }
ark-bn254.workspace = true
ark-ec.workspace = true
ark-groth16.workspace = true
ark-ed-on-bn254.workspace = true
ark-serialize.workspace = true

[dev-dependencies]
jsonschema = { version = "0.26", default-features = false }
