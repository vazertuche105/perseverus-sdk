openapi: 3.1.0
info:
  title: Perseverus (BTC Medusa) API
  version: 1.0.0
  summary: Private, token-gated Bitcoin privacy analysis for wallets.
  description: |
    The stable `/v1` interface of a Perseverus server. Wallets use it to buy
    anonymous tokens and to learn the privacy exposure of their coins
    **without telling the server which coins they are asking about**.

    Most integrators should use the `perseverus-sdk` library (Rust core with
    Kotlin/Swift bindings) instead of calling these endpoints directly: the
    cryptography (OPRF blinding, Groth16 proofs, DLEQ verification, tag
    decryption) lives in the SDK. This document is the contract the SDK is
    built on, and the reference for anyone writing their own client.

    ## Privacy invariants
    * There is **no** endpoint that takes a txid or outpoint, and there never
      will be. Clients download encrypted filters for real and decoy block
      heights and match locally; the server sees heights, never transactions.
    * `POST /v1/filters/batch` and `POST /v1/analyze/batch` must be separate
      requests, over separate Tor circuits in production. The analyze request
      carries no heights, so the server cannot join a spend batch to its decoys.
    * `POST /v1/board/publish` must use a circuit isolated from the redeem call.
    * Token balances never leave the client.

    ## Conventions
    * JSON in `snake_case`. Binary values are lowercase hex. Curve points are
      compressed Baby Jubjub (32 bytes); field elements are BN254 Fr,
      canonical little-endian (32 bytes). Months are `YYYYMM` integers.
    * Every error, including malformed JSON and unknown routes, uses the
      `Error` envelope with a stable `code`.
    * `Idempotency-Key` is honoured on purchase, redeem and analyze.
  license:
    name: All rights reserved
servers:
  - url: http://medusayl5rrmgnekpabcduw7onhvdowmfart2mulq3b64chgzng52had.onion
    description: Production (Tor hidden service). Route over Tor (socks5h).
  - url: http://178.105.65.132:3030
    description: Production over clearnet (development use; the server sees your IP).

tags:
  - name: meta
    description: What the server is and what it supports.
  - name: tokens
    description: Buy anonymous token packs and redeem them.
  - name: analyze
    description: Spend tokens to decrypt privacy tags.
  - name: filters
    description: Encrypted per-block filters and the tag codebook.
  - name: circuit
    description: Groth16 keys for the spend proof.
  - name: revocation
  - name: board

paths:
  /v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Server parameters, limits and capabilities.
      description: |
        Call at startup. Pin `server_pubkey_hex` on first use and refuse a
        server that later presents a different key. Use `current_month` as the
        spend proof's `current_month`. `circuit.pk_sha256` is `null` when the
        server doesn't serve the proving key (production): ship `pk.bin` with
        the app instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }

  /v1/codebook:
    get:
      tags: [filters]
      operationId: getCodebook
      summary: Global tag codebook (PSCB format). Public, non-secret.
      description: |
        A decrypted filter entry is an index into this table, which maps it to
        a 24-bit privacy tag. Download once per `codebook_id` and check it
        against each filter's `codebook_id` before decoding.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Codebook' }
        '304': { description: Not modified (If-None-Match matched). }
        '404': { $ref: '#/components/responses/Error' }

  /v1/circuit/pk:
    get:
      tags: [circuit]
      operationId: getProvingKey
      summary: Groth16 proving key (~4 MB), if the server serves it.
      description: |
        Production does **not** serve the proving key (404 with guidance):
        wallets ship `pk.bin` inside the app, so a malicious server can't swap
        it. Development servers may serve it.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Compressed ark-serialize ProvingKey<Bn254>.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/Error' }

  /v1/circuit/vk:
    get:
      tags: [circuit]
      operationId: getVerifyingKey
      summary: Groth16 verifying key.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Compressed ark-serialize VerifyingKey<Bn254>.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/Error' }

  /v1/tokens/purchase:
    post:
      tags: [tokens]
      operationId: createPurchase
      summary: Start a token purchase.
      description: |
        One flow for every payment method: create a purchase, show the user
        how to pay, poll its status, then redeem it with the same
        `purchase_id`.

        * `lightning`: plans `trial` (1 token) or `onetime` (100). The server
          prices the invoice at the live BTC/USD rate. Test servers may also
          sell `dev` (100 tokens at a token price, for integration testing;
          see `dev_plan` in `/v1/meta`). Elsewhere `dev` gets
          `403 plan_unavailable`.
        * `card` (Stripe): plans `onetime` or `monthly` (1 pack) and `yearly`
          (13 monthly packs). Open `payment.checkout_url` in a browser.
        * `btc` (silent payment) is issued by a separate payment scanner;
          this endpoint returns `501`. Redeem the scanner's `psbtc1…` code
          with `POST /v1/tokens/redeem {btc_code}`.

        `purchase_id` is a **bearer credential**: whoever holds it can redeem
        the paid pack. Store it in the wallet's secure storage.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
            examples:
              lightning:
                value: { method: lightning, plan: onetime }
              card_yearly:
                value: { method: card, plan: yearly }
      responses:
        '201':
          description: Purchase created.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Purchase' }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/tokens/purchase/{purchase_id}/status:
    get:
      tags: [tokens]
      operationId: getPurchaseStatus
      summary: Poll a purchase until it is paid.
      description: |
        Poll every few seconds while the user pays. `paid` means it's ready
        to redeem. Lightning purchases report `redeemed` afterwards; card
        purchases return `404` once redeemed.
      parameters:
        - name: purchase_id
          in: path
          required: true
          schema: { type: string, pattern: '^(ln|card)_[0-9a-f]+$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseStatus' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/tokens/redeem:
    post:
      tags: [tokens]
      operationId: redeemTokens
      summary: Exchange a paid purchase for blind-signed token packs.
      description: |
        Send the blinded tokens together with the paid credential: a
        `purchase_id` (Lightning or card) or a `btc_code`. The server signs
        the blinded points without seeing the tokens. This single call is the
        only link between the payment and the pack; afterwards, spends cannot
        be linked to the payment.

        One pack per purchase, except card `yearly` (up to 13). The request is
        fully validated before the credential is used up, so a malformed
        request never burns a paid purchase. Use an `Idempotency-Key`: if the
        connection drops after the server signed, retrying with the same key
        returns the same packs.

        Before choosing each `pack_id`, read `GET /v1/board/slots` and re-roll
        any id whose revocation slot is taken.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemRequest' }
      responses:
        '200':
          description: One signed pack per requested pack, in request order.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/board/slots:
    get:
      tags: [board]
      operationId: getBoardSlots
      summary: Occupied 16-bit revocation slots.
      description: Read before choosing a `pack_id`; re-roll ids whose slot is taken.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardSlots' }

  /v1/board/publish:
    post:
      tags: [board]
      operationId: publishBoardEntry
      summary: Publish a card pack's attribution entry (chargeback handling).
      description: |
        Card packs only. Send over a Tor circuit isolated from the redeem call.
        A new entry needs the one-time `board_ticket` returned with that pack
        by `POST /v1/tokens/redeem`. Republishing an entry that is already on
        the board succeeds without one and changes nothing.
        Errors: `403 ticket_invalid` (missing, invalid, expired or already
        used), `409 slot_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardPublishRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardPublishResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/revocation/root:
    get:
      tags: [revocation]
      operationId: getRevocationRoot
      summary: Current revocation tree root (a public input of every spend proof).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationRoot' }

  /v1/revocation/list:
    get:
      tags: [revocation]
      operationId: getRevocationList
      summary: Every revoked key, plus the root they hash to.
      description: |
        The whole public revocation list, identical for every client. Wallets
        rebuild the depth-16 tree from `revoked_keys_hex` (in order), check it
        hashes to `revocation_root_hex`, and build their own non-inclusion
        proofs on the device, so no `pack_id` is ever sent. Keys are
        `Poseidon(pack_id)` as compressed little-endian field elements.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationList' }

  /v1/revocation/proof/{pack_id}:
    get:
      tags: [revocation]
      operationId: getRevocationProof
      deprecated: true
      summary: Proof that a pack is not revoked (deprecated).
      description: |
        Deprecated: it puts `pack_id` on the wire, which lets the server link
        spends from the same pack. Use `/v1/revocation/list` and build the
        proof on the device. Kept for older SDKs. `is_included: true` means
        the pack was revoked and its tokens can't be spent.
      parameters:
        - name: pack_id
          in: path
          required: true
          schema: { type: integer, format: uint64, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationProof' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/filters/batch:
    post:
      tags: [filters]
      operationId: getFiltersBatch
      summary: Encrypted per-block filters for real and decoy heights.
      description: |
        Mix the real heights with decoys and shuffle them; the server can't
        tell which are real. Heights without a filter come back in `missing`
        (never built on demand); treat those inputs as *not covered* and spend
        no token on them. `/v1/meta` lists the covered ranges.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterBatchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterBatch' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/analyze/batch:
    post:
      tags: [analyze]
      operationId: analyzeBatch
      summary: Spend tokens for blinded OPRF evaluations, one per matched transaction.
      description: |
        Each entry carries one blinded point (the funding txid, hashed to the
        curve and blinded) and a Groth16 proof that spends one unspent,
        unrevoked, unexpired token. The server checks the proof, burns its
        nullifier, and returns the evaluated point with a DLEQ proof. The
        client verifies the DLEQ proof, unblinds, and decrypts the tag.

        Entries succeed or fail independently. A failed entry's token was not
        burned, **except** `nullifier_spent` (that token was already used).
        Spend one token per distinct funding transaction that matched a
        filter locally; never for ungraded or not-covered inputs. The request
        contains no heights, txids or outpoints.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeBatchRequest' }
      responses:
        '200':
          description: One result per request entry, in order.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzeBatchResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        1–128 characters, unique per logical operation (a UUID is ideal).
        Retrying with the same key and body returns the stored response
        (`Idempotent-Replayed: true`); the same key with a different body is
        refused with `422 idempotency_key_reused`. Keys are kept for 24 h in
        server memory and forgotten on restart. 5xx responses are not stored.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag from a previous response; matching returns 304.
      schema: { type: string }

  headers:
    ETag:
      description: Quoted SHA-256 of the content.
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` when this response was replayed for a repeated Idempotency-Key.'
      schema: { type: string, enum: ['true'] }

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Hex:
      type: string
      pattern: '^([0-9a-f]{2})*$'
    PointHex:
      description: Compressed Baby Jubjub point, 32 bytes.
      type: string
      pattern: '^[0-9a-f]{64}$'
    FieldHex:
      description: BN254 Fr element, canonical little-endian, 32 bytes.
      type: string
      pattern: '^[0-9a-f]{64}$'

    ErrorDetail:
      type: object
      required: [code, message, retryable]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable code. New codes may be added; treat unknown codes as `internal`.
          enum:
            - bad_request
            - batch_too_large
            - payment_required
            - underpaid
            - plan_unavailable
            - ticket_invalid
            - credential_invalid
            - credential_expired
            - credential_used
            - proof_invalid
            - revocation_root_mismatch
            - nullifier_spent
            - slot_taken
            - forbidden
            - conflict
            - not_found
            - not_configured
            - not_implemented
            - upstream_unavailable
            - idempotency_key_reused
            - internal
        message: { type: string, description: Human-readable detail. Don't parse it. }
        retryable: { type: boolean, description: True when the same request may succeed later. }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    Meta:
      type: object
      required: [api_version, min_client_version, server_pubkey_hex, current_month, test_clock, circuit, filters, limits, payment_methods]
      additionalProperties: false
      properties:
        api_version: { type: string, example: '1.0.0' }
        min_client_version: { type: string, example: '0.1.0' }
        server_pubkey_hex: { $ref: '#/components/schemas/PointHex' }
        current_month: { type: integer, example: 202610 }
        test_clock: { type: boolean, description: True only on test servers with a simulated clock. }
        circuit:
          type: object
          required: [version, pk_sha256, vk_sha256]
          additionalProperties: false
          properties:
            version: { type: string, example: v11 }
            pk_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
            vk_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        filters:
          type: object
          required: [format_version, tag_format, codebook_id, covered_ranges]
          additionalProperties: false
          properties:
            format_version: { type: integer, enum: [5] }
            tag_format: { type: string, enum: [v3-lean] }
            codebook_id: { type: [string, 'null'], pattern: '^[0-9a-f]{8}$' }
            covered_ranges:
              type: array
              items:
                type: object
                required: [from, to]
                additionalProperties: false
                properties:
                  from: { type: integer }
                  to: { type: integer }
        limits:
          type: object
          required: [max_filters_per_batch, max_spends_per_batch, max_tokens_per_pack, max_packs_per_redeem]
          additionalProperties: false
          properties:
            max_filters_per_batch: { type: integer, example: 200 }
            max_spends_per_batch: { type: integer, example: 64 }
            max_tokens_per_pack: { type: integer }
            max_packs_per_redeem: { type: integer, example: 13 }
        payment_methods:
          type: array
          items: { type: string, enum: [lightning, card, btc] }
        dev_plan:
          description: Only on test servers that sell the Lightning `dev` plan. Absent in production.
          type: object
          required: [usd, tokens]
          additionalProperties: false
          properties:
            usd: { type: number, example: 0.10 }
            tokens: { type: integer, example: 100 }

    Codebook:
      type: object
      required: [codebook_hex, len, codebook_id]
      additionalProperties: false
      properties:
        codebook_hex: { $ref: '#/components/schemas/Hex' }
        len: { type: integer }
        codebook_id: { type: [string, 'null'], pattern: '^[0-9a-f]{8}$' }

    PurchaseRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [lightning, card, btc] }
        plan:
          type: string
          enum: [trial, onetime, monthly, yearly, dev]
          default: onetime
          description: trial (Lightning, 1 token), onetime (100), monthly (card), yearly (card, 13 packs), dev (Lightning, 100 tokens at a token price; test servers only).
        success_url: { type: string, format: uri, description: Card only. Where Stripe sends the user after paying. }
        cancel_url: { type: string, format: uri, description: Card only. }

    Purchase:
      type: object
      required: [purchase_id, method, plan, packs, tokens, expires_at, payment]
      additionalProperties: false
      properties:
        purchase_id: { type: string, pattern: '^(ln|card)_[0-9a-f]+$', description: Bearer credential; store securely. }
        method: { type: string, enum: [lightning, card] }
        plan: { type: string }
        packs: { type: integer, description: Packs this purchase can redeem. }
        tokens: { type: integer, description: Total tokens across those packs. }
        expires_at: { type: integer, description: Unix seconds after which payment is no longer accepted. }
        payment:
          oneOf:
            - $ref: '#/components/schemas/LightningPayment'
            - $ref: '#/components/schemas/CardPayment'
          discriminator:
            propertyName: kind
            mapping:
              lightning: '#/components/schemas/LightningPayment'
              card: '#/components/schemas/CardPayment'

    LightningPayment:
      type: object
      required: [kind, bolt11, amount_sat]
      additionalProperties: false
      properties:
        kind: { type: string, const: lightning }
        bolt11: { type: string, description: Show as a QR code or hand to a Lightning wallet. }
        amount_sat: { type: integer }

    CardPayment:
      type: object
      required: [kind, checkout_url]
      additionalProperties: false
      properties:
        kind: { type: string, const: card }
        checkout_url: { type: string, format: uri, description: Open in a browser. }

    PurchaseStatus:
      type: object
      required: [purchase_id, state]
      additionalProperties: false
      properties:
        purchase_id: { type: string }
        state: { type: string, enum: [pending, paid, redeemed, expired] }
        expires_at: { type: integer }

    BlindedPack:
      type: object
      required: [alphas, base_points]
      additionalProperties: false
      properties:
        alphas:
          description: Blinded points α_i = r_i·P_i.
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PointHex' }
        base_points:
          description: P_i = Poseidon(seed, pack_id, i)·H_TOKEN. Same length as alphas.
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PointHex' }

    RedeemRequest:
      type: object
      required: [packs]
      properties:
        purchase_id: { type: string, description: From POST /v1/tokens/purchase (Lightning or card). }
        btc_code: { type: string, description: 'psbtc1.… code from the silent-payment scanner.' }
        packs:
          type: array
          minItems: 1
          maxItems: 13
          items: { $ref: '#/components/schemas/BlindedPack' }
      oneOf:
        - required: [purchase_id]
        - required: [btc_code]

    SignedPack:
      type: object
      required: [betas, proof_challenge, proof_response, poseidon_proofs]
      additionalProperties: false
      properties:
        betas:
          description: Signed blinded points β_i, in the same order as alphas.
          type: array
          items: { $ref: '#/components/schemas/PointHex' }
        proof_challenge: { $ref: '#/components/schemas/Hex' }
        proof_response: { $ref: '#/components/schemas/Hex' }
        poseidon_proofs:
          description: Per-token [challenge, response] Poseidon DLEQ proofs, used inside the spend circuit.
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { $ref: '#/components/schemas/FieldHex' }
        board_ticket:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Card packs only. One-time ticket for this pack's `POST /v1/board/publish`, valid 30 days.

    RedeemResponse:
      type: object
      required: [packs]
      additionalProperties: false
      properties:
        packs:
          type: array
          items: { $ref: '#/components/schemas/SignedPack' }

    BoardSlots:
      type: object
      required: [slots]
      additionalProperties: false
      properties:
        slots:
          type: array
          items: { type: integer, minimum: 0, maximum: 65535 }

    BoardPublishRequest:
      type: object
      required: [pack_id, tag_hex, expiration_month]
      properties:
        pack_id: { type: integer, format: uint64 }
        tag_hex: { $ref: '#/components/schemas/FieldHex' }
        expiration_month: { type: integer, example: 202611 }
        ticket:
          type: string
          description: The `board_ticket` from the redeem response. Required for a new entry.

    BoardPublishResponse:
      type: object
      required: [board_size, board_root_hex]
      additionalProperties: false
      properties:
        board_size: { type: integer }
        board_root_hex: { $ref: '#/components/schemas/FieldHex' }

    RevocationRoot:
      type: object
      required: [revocation_root_hex]
      additionalProperties: false
      properties:
        revocation_root_hex: { $ref: '#/components/schemas/FieldHex' }

    RevocationList:
      type: object
      required: [revocation_root_hex, revoked_keys_hex]
      additionalProperties: false
      properties:
        revocation_root_hex: { $ref: '#/components/schemas/FieldHex' }
        revoked_keys_hex:
          type: array
          description: Revoked keys in insertion order.
          items: { $ref: '#/components/schemas/FieldHex' }
    RevocationProof:
      type: object
      required: [is_included, siblings_hex, path_bits]
      additionalProperties: false
      properties:
        is_included: { type: boolean, description: True when the pack is revoked. }
        siblings_hex:
          type: array
          items: { $ref: '#/components/schemas/FieldHex' }
        path_bits:
          type: array
          items: { type: boolean }

    FilterBatchRequest:
      type: object
      required: [heights]
      properties:
        heights:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: integer, minimum: 0 }

    FilterBatch:
      type: object
      required: [filters, missing]
      additionalProperties: false
      properties:
        filters:
          type: array
          items:
            type: object
            required: [height, filter_hex, num_entries]
            additionalProperties: false
            properties:
              height: { type: integer }
              num_entries: { type: integer }
              filter_hex: { $ref: '#/components/schemas/Hex' }
        missing:
          type: array
          items: { type: integer }

    SpendProof:
      type: object
      required: [nullifier_hex, revocation_root_hex, current_month, proof_hex]
      properties:
        nullifier_hex: { $ref: '#/components/schemas/FieldHex' }
        revocation_root_hex: { $ref: '#/components/schemas/FieldHex' }
        current_month: { type: integer }
        proof_hex: { $ref: '#/components/schemas/Hex' }

    AnalyzeBatchRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            required: [blinded_point, spend]
            properties:
              blinded_point: { $ref: '#/components/schemas/PointHex' }
              spend: { $ref: '#/components/schemas/SpendProof' }

    AnalyzeBatchResponse:
      type: object
      required: [responses]
      additionalProperties: false
      properties:
        responses:
          type: array
          items:
            type: object
            required: [ok]
            additionalProperties: false
            properties:
              ok: { type: boolean }
              evaluated_point: { $ref: '#/components/schemas/PointHex' }
              proof_challenge: { $ref: '#/components/schemas/Hex' }
              proof_response: { $ref: '#/components/schemas/Hex' }
              error: { $ref: '#/components/schemas/ErrorDetail' }
