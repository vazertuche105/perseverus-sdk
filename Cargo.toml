[workspace]
resolver = "2"
members = [
    "core",
    "circuits",
    "client-native",
    "sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"  # all rights reserved until the owner picks a license
authors = ["Valentino Zertuche <z.valentino@gmail.com>"]

[workspace.dependencies]
# Elliptic curves.
# Credential curve (VOPRF, DLEQ, filter encryption):  BabyJubJub (twisted Edwards
# curve embedded in BN254's scalar field). 128-bit DLP security, no pairings needed.
# SNARK curve:  BN254 (Groth16 with ~10-15K constraints). Since Fq(BabyJubJub) ==
# Fr(BN254), all BabyJubJub point arithmetic is native inside the circuit — no
# non-native field simulation needed. DLEQ proofs replace the old in-circuit pairing
# check, eliminating the BW6-761 requirement entirely.
ark-ff = "0.5"
ark-ec = "0.5"
ark-bn254 = "0.5"
ark-ed-on-bn254 = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

# Groth16 zk-SNARK (on BN254 — setup runs in minutes on a laptop)
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-snark = "0.5"

# Poseidon hash + Merkle tree (native + r1cs)
ark-crypto-primitives = { version = "0.5", features = ["sponge", "crh", "merkle_tree", "r1cs"] }

# Hashing
siphasher = "1.0"
sha2 = "0.10"
hmac = "0.12"

# Encryption
aes-gcm = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Async / HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Random
rand = "0.8"
rand_core = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Poseidon hash
# Note: dusk-poseidon targets dusk's own BLS12-381; we'll use light-poseidon instead
# which works with arkworks scalar fields
