name: CI
on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No direct printing in library code
        run: python3 scripts/check-no-logging.py
      - name: Check bundled proving key
        shell: bash
        run: cd assets/circuit-v10 && shasum -a 256 -c pk.bin.sha256
      - name: Test
        run: cargo test --workspace --release
      - name: Generate Kotlin bindings
        shell: bash
        run: |
          cargo build -p perseverus-sdk --release --lib
          LIB=target/release/libperseverus_sdk.so
          [ "$RUNNER_OS" = "macOS" ] && LIB=target/release/libperseverus_sdk.dylib
          cargo run -q -p perseverus-sdk --features bindgen --bin uniffi-bindgen -- \
            generate --library "$LIB" --language kotlin --out-dir sdk/bindings/kotlin
          test -s sdk/bindings/kotlin/com/btcmedusa/perseverus/perseverus_sdk.kt

  # The Kotlin/JVM sample integrators run first (docs/02-quickstart.md):
  # builds the library, generates bindings and compiles the app.
  kotlin-sample:
    name: kotlin sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          cd sdk/examples/kotlin-jvm
          ./gradlew --no-daemon -q compileKotlin 2>&1 | tee build.log || {
            echo "::error title=sample compile failed::$(tail -n 40 build.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            exit 1
          }

  # We don't publish mobile binaries; these jobs prove the integrator build
  # scripts in scripts/ (documented in docs/08-building.md) keep working.
  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # The runner image provides the NDK path as a shell variable (not in the `env` context).
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android.sh 2>&1 | tee build.log || {
            # Surface the end of the log as an annotation (readable from the checks API).
            echo "::error title=build failed::$(tail -n 40 build.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            exit 1
          }

  ios:
    name: ios build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          scripts/build-ios.sh 2>&1 | tee build.log || {
            # Surface the end of the log as an annotation (readable from the checks API).
            echo "::error title=build failed::$(tail -n 40 build.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Swift smoke test (calls the real library from Swift)
        shell: bash
        run: |
          set -o pipefail
          scripts/swift-smoke.sh 2>&1 | tee smoke.log || {
            echo "::error title=swift smoke failed::$(tail -n 40 smoke.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            exit 1
          }
